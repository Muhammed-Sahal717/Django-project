{% extends 'base.html' %} {% block title %}Add New Student{% endblock %} {% block content %}
<header>
  <h1>Add New Student</h1>
</header>

<div
  style="
    background: #09090b;
    padding: 2rem;
    border-radius: 0.5rem;
    border: 1px solid #27272a;
    max-width: 500px;
  "
>
  <!-- The form method="POST" means data will be submitted securely -->
  <form method="POST">
    <!-- Django requires a csrf_token for security against cross-site request forgeries -->
    {% csrf_token %}

    <!-- We iterate over the fields in the form automatically -->
    {% for field in form %}
    <div class="form-group">
      <label class="form-label" for="{{ field.id_for_label }}"
        >{{ field.label }}</label
      >
      {{ field }}
      <!-- Display validation errors if any -->
      {% if field.errors %}
      <div style="color: #f87171; font-size: 0.75rem; margin-top: 0.25rem">
        {{ field.errors.0 }}
      </div>
      {% endif %}
    </div>
    {% endfor %}

    <div
      style="margin-top: 2rem; display: flex; align-items: center; gap: 1rem"
    >
      <button type="submit" class="btn-primary">Save Student</button>
      <a
        href="{% url 'dashboard' %}"
        style="color: #a1a1aa; text-decoration: none; font-size: 0.875rem"
        >Cancel</a
      >
    </div>
  </form>
</div>
{% endblock %}
