<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Student Dashboard{% endblock %}</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background-color: #09090b;
        color: #fafafa;
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 250px;
        background-color: #09090b;
        color: #fafafa;
        padding: 2rem 1rem;
        border-right: 1px solid #27272a;
      }
      .sidebar h2 {
        margin-bottom: 2rem;
        font-size: 1.5rem;
        text-align: center;
        color: #fafafa;
        letter-spacing: -0.025em;
        font-weight: 600;
      }
      .sidebar a {
        display: block;
        color: #a1a1aa;
        text-decoration: none;
        padding: 0.75rem 1rem;
        border-radius: 0.375rem;
        margin-bottom: 0.5rem;
        transition:
          background 0.2s,
          color 0.2s;
        font-size: 0.875rem;
        font-weight: 500;
      }
      .sidebar a:hover {
        background-color: #27272a;
        color: #fafafa;
      }
      .sidebar a.active {
        background-color: #fafafa;
        color: #09090b;
      }
      .main-content {
        flex: 1;
        padding: 2.5rem;
        overflow-y: auto;
      }
      header {
        margin-bottom: 2rem;
      }
      h1 {
        font-size: 1.875rem;
        font-weight: 600;
        color: #fafafa;
        letter-spacing: -0.025em;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1.5rem;
        margin-bottom: 2rem;
      }
      .stat-card {
        background: #09090b;
        padding: 1.5rem;
        border-radius: 0.5rem;
        border: 1px solid #27272a;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }
      .stat-card h3 {
        font-size: 0.875rem;
        color: #a1a1aa;
        font-weight: 500;
        margin-bottom: 0.5rem;
      }
      .stat-card .value {
        font-size: 2rem;
        font-weight: 700;
        color: #fafafa;
        letter-spacing: -0.025em;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #09090b;
        border-radius: 0.5rem;
        overflow: hidden;
        border: 1px solid #27272a;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }
      th,
      td {
        padding: 1rem;
        text-align: left;
        border-bottom: 1px solid #27272a;
        font-size: 0.875rem;
      }
      th {
        background-color: #09090b;
        font-weight: 500;
        color: #a1a1aa;
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr:hover td {
        background-color: #18181b;
      }
      .status {
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 500;
        display: inline-block;
      }
      .status.active {
        background-color: rgba(52, 211, 153, 0.1);
        color: #34d399;
        border: 1px solid rgba(52, 211, 153, 0.2);
      }
      .status.inactive {
        background-color: rgba(248, 113, 113, 0.1);
        color: #f87171;
        border: 1px solid rgba(248, 113, 113, 0.2);
      }

      /* Form Styles */
      .form-group {
        margin-bottom: 1.25rem;
      }
      .form-label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: #a1a1aa;
      }
      .form-input {
        width: 100%;
        padding: 0.75rem 1rem;
        background-color: #09090b;
        border: 1px solid #27272a;
        border-radius: 0.375rem;
        color: #fafafa;
        font-family: inherit;
        font-size: 0.875rem;
        outline: none;
        transition: border-color 0.2s;
      }
      .form-input:focus {
        border-color: #fafafa;
      }
      .form-checkbox {
        width: 1.25rem;
        height: 1.25rem;
        accent-color: #00bb22;
      }
      .btn-primary {
        background-color: #fafafa;
        color: #09090b;
        padding: 0.625rem 1.25rem;
        border-radius: 0.375rem;
        border: none;
        font-weight: 600;
        font-size: 0.875rem;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .btn-primary:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <h2>EduDash</h2>
      <a
        href="{% url 'dashboard' %}"
        class="{% if request.path == '/' %}active{% endif %}"
        >Dashboard</a
      >
      <a
        href="{% url 'add_student' %}"
        class="{% if request.path == '/add-student/' %}active{% endif %}"
        >Add Student</a
      >
      <a
        href="{% url 'platform_info' %}"
        class="{% if request.path == '/info/' %}active{% endif %}"
        >About Platform</a
      >
    </div>
    <div class="main-content">{% block content %}{% endblock %}</div>
  </body>
</html>
