<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Student Dashboard{% endblock %}</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: #ffffff;
        color: #09090b;
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 260px;
        background-color: #f4f4f5;
        border-right: 1px solid #e4e4e7;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
      }
      .sidebar h2 {
        margin-bottom: 2rem;
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: -0.025em;
        padding-left: 0.75rem;
        color: #09090b;
      }
      .sidebar a {
        display: block;
        color: #71717a;
        text-decoration: none;
        padding: 0.625rem 0.75rem;
        border-radius: 0.375rem;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.25rem;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .sidebar a:hover {
        background-color: #e4e4e7;
        color: #09090b;
      }
      .sidebar a.active {
        background-color: #09090b;
        color: #fafafa;
      }
      .main-content {
        flex: 1;
        padding: 2.5rem;
        overflow-y: auto;
        background-color: #ffffff;
      }
      header {
        margin-bottom: 2rem;
      }
      h1 {
        font-size: 1.875rem;
        font-weight: 600;
        letter-spacing: -0.025em;
        color: #09090b;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .stat-card {
        background: #ffffff;
        padding: 1.5rem;
        border-radius: 0.5rem;
        border: 1px solid #e4e4e7;
      }
      .stat-card h3 {
        font-size: 0.875rem;
        font-weight: 500;
        color: #71717a;
        margin-bottom: 0.5rem;
      }
      .stat-card .value {
        font-size: 1.875rem;
        font-weight: 600;
        letter-spacing: -0.025em;
        color: #09090b;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
        border: 1px solid #e4e4e7;
        border-radius: 0.5rem;
        overflow: hidden;
      }
      th,
      td {
        padding: 0.75rem 1rem;
        text-align: left;
        border-bottom: 1px solid #e4e4e7;
        font-size: 0.875rem;
      }
      th {
        background-color: #f4f4f5;
        font-weight: 600;
        color: #71717a;
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr:hover td {
        background-color: #fafafa;
      }
      .status {
        display: inline-flex;
        align-items: center;
        padding: 0.125rem 0.625rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 500;
        border: 1px solid transparent;
      }
      .status.active {
        background-color: #f4f4f5;
        color: #09090b;
        border-color: #e4e4e7;
      }
      .status.inactive {
        background-color: #ffffff;
        color: #71717a;
        border-color: #e4e4e7;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <h2>EduDash</h2>
      <a href="{% url 'dashboard' %}">Dashboard</a>
      <a href="{% url 'platform_info' %}">About Platform</a>
    </div>
    <div class="main-content">{% block content %}{% endblock %}</div>
  </body>
</html>
