<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to My Django App</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 2rem;
        overflow: hidden;
        position: relative;
      }

      /* Decorative background elements */
      .glow {
        position: absolute;
        width: 600px;
        height: 600px;
        background: radial-gradient(
          circle,
          rgba(56, 189, 248, 0.15) 0%,
          rgba(15, 23, 42, 0) 70%
        );
        top: -200px;
        left: -200px;
        border-radius: 50%;
        z-index: 0;
      }

      .glow-2 {
        position: absolute;
        width: 500px;
        height: 500px;
        background: radial-gradient(
          circle,
          rgba(168, 85, 247, 0.15) 0%,
          rgba(15, 23, 42, 0) 70%
        );
        bottom: -150px;
        right: -100px;
        border-radius: 50%;
        z-index: 0;
      }

      .container {
        max-width: 800px;
        z-index: 1;
        animation: fadeIn 1s ease-out;
      }

      h1 {
        font-size: 4rem;
        font-weight: 800;
        margin-bottom: 1.5rem;
        line-height: 1.2;
        background: linear-gradient(to right, #38bdf8, #a855f7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      p.subtitle {
        font-size: 1.25rem;
        color: var(--text-muted);
        margin-bottom: 2.5rem;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        line-height: 1.6;
      }

      .cta-buttons {
        display: flex;
        gap: 1rem;
        justify-content: center;
      }

      .btn {
        display: inline-block;
        padding: 0.875rem 2rem;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        border-radius: 9999px;
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .btn-primary {
        background-color: var(--accent);
        color: var(--bg-color);
        border: 2px solid var(--accent);
        box-shadow: 0 4px 14px 0 rgba(56, 189, 248, 0.39);
      }

      .btn-primary:hover {
        background-color: transparent;
        color: var(--accent);
        transform: translateY(-2px);
      }

      .btn-secondary {
        background-color: transparent;
        color: var(--text-main);
        border: 2px solid rgba(255, 255, 255, 0.2);
      }

      .btn-secondary:hover {
        border-color: var(--text-main);
        transform: translateY(-2px);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 2.5rem;
        }
        .cta-buttons {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="glow-2"></div>

    <div class="container">
      <h1>Welcome to My Django App</h1>
      <p class="subtitle">
        A minimal, lightning-fast foundation for building modern web
        applications. Powered by Django and designed with simplicity in mind.
      </p>

      <div class="cta-buttons">
        <a href="#" class="btn btn-primary">Get Started</a>
        <a href="#" class="btn btn-secondary">Learn More</a>
      </div>
    </div>
  </body>
</html>
